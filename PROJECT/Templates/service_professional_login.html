<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Professional Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/signup.css') }}">
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-popup flash-message {{ messages[-1][0] }}" role="alert" aria-live="assertive">
            {{ messages[-1][1] }}
        </div>
        <script>
            setTimeout(function () {
                var flashMessage = document.querySelector('.flash-popup');
                if (flashMessage) {
                    flashMessage.remove();
                }
            }, 5000);
        </script>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.service_professional_login') }}" method="POST">
            <div class="login">
                <h3 class="title">Service Professional Login</h3>
                <div class="text-input">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
                <div class="text-input">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="signin-btn">Login</button>
                <div class="links">
                    <div class="create">
                        <a href="{{ url_for('auth.service_professional_signup') }}">New Service Professional? Create Your Account</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
