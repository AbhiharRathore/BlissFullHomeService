<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Service</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/admindashboard.css') }}">
</head>
<body>
    <div class="container">
        <h2>Rate the Professional for your Service</h2>
        <form method="POST">
            <div class="form-group">
                <label for="rating">Rating (1 to 5)</label>
                <input type="number" name="rating" min="1" max="5" step="0.1" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Rating</button>
        </form>
    </div>
</body>
</html>
