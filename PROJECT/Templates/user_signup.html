{% extends 'base.html' %}
{% block title %}Customer Sign Up - BlissfulHome{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle mb-3"
                            style="width:70px;height:70px;">
                            <i class="bi bi-person-plus-fill fs-2 text-primary"></i>
                        </div>
                        <h3 class="fw-bold">Create Account</h3>
                        <p class="text-muted">Join as a customer to book home services</p>
                    </div>
                    <form method="POST" action="{{ url_for('auth.user_signup') }}" novalidate>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="name" name="name" placeholder="Full Name"
                                required minlength="2">
                            <label for="name"><i class="bi bi-person me-2"></i>Full Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username"
                                required minlength="3">
                            <label for="username"><i class="bi bi-at me-2"></i>Username</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Phone" required
                                pattern="[0-9]{10}">
                            <label for="phone"><i class="bi bi-phone me-2"></i>Phone Number</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="address" name="address" placeholder="Address"
                                required>
                            <label for="address"><i class="bi bi-geo-alt me-2"></i>Address</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="pincode" name="pincode" placeholder="Pincode"
                                required pattern="[0-9]{6}" maxlength="6">
                            <label for="pincode"><i class="bi bi-mailbox me-2"></i>Pincode</label>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="pwd" name="pwd"
                                        placeholder="Password" required minlength="4">
                                    <label for="pwd"><i class="bi bi-lock me-2"></i>Password</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="confpwd" name="confpwd"
                                        placeholder="Confirm Password" required>
                                    <label for="confpwd"><i class="bi bi-lock-fill me-2"></i>Confirm</label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-person-check me-2"></i>Create Account
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Already have an account? <a href="{{ url_for('auth.user_login') }}"
                                class="fw-semibold text-decoration-none">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
