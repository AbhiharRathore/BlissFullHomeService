<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/signup.css') }}">
</head>

<body>
    
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-popup flash-message {{ messages[-1][0] }}" role="alert" aria-live="assertive">
            {{ messages[-1][1] }}
        </div>
       
       <script>
            setTimeout(function () {
                var flashMessage = document.querySelector('.flash-popup');
                if (flashMessage) {
                    flashMessage.remove();
                }
            }, 5000);
        </script>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.user_login') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="login">
                <h3 class="title">User Login</h3>
                <div class="text-input">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
                <div class="text-input">
                    <label for="pwd">Password</label>
                    <input type="password" id="pwd" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="signin-btn">Login</button>
                <div class="links">
                    <a href="{{ url_for('auth.user_signup') }}">New User? Create Your Account</a>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
