<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/signup.css') }}">
</head>
<body>
    <div class="container">
        <h3 class="title">Admin Login</h3>

        <form id="loginForm" action="{{ url_for('auth.admin_login') }}" method="POST">
            <div class="text-input">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter Username" required>
            </div>

            <div class="text-input">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>

            <button class="signin-btn" type="submit">Login</button>
        </form>

        <div class="spinner" id="spinner"></div>

        <!-- Flash message container -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-popup {{ messages[0][0] }}">
                    {{ messages[0][1] }}
                </div>
            {% endif %}
        {% endwith %}
    </div>

    <script>
        window.onload = function() {
            const flashPopup = document.querySelector('.flash-popup');
            if (flashPopup) {
                setTimeout(function() {
                    flashPopup.style.opacity = 0;
                }, 5000);
            }
        };
    </script>
</body>
</html>
