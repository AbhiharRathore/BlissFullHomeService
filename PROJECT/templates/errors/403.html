<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .error-container { text-align: center; padding: 40px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; }
        h1 { font-size: 72px; color: #e67e22; margin: 0; }
        h2 { color: #2c3e50; margin: 10px 0; }
        p { color: #555; font-size: 16px; }
        a { color: #3498db; text-decoration: none; font-size: 18px; display: inline-block; margin-top: 20px; padding: 10px 25px; border: 2px solid #3498db; border-radius: 5px; transition: all 0.3s; }
        a:hover { background-color: #3498db; color: white; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>403</h1>
        <h2>Access Denied</h2>
        <p>You don't have permission to access this page.</p>
        <a href="/">Go Home</a>
    </div>
</body>
</html>
