<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/signup.css') }}">
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-popup {{ messages[-1][0] }}">
            {{ messages[-1][1] }}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.user_signup') }}" method="POST" onsubmit="return validateForm()">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h3 class="title">Create Account</h3>

            <!-- Full Name -->
            <div class="text-input">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required aria-required="true">
            </div>

            <!-- Username -->
            <div class="text-input">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required aria-required="true">
            </div>

            <!-- Phone Number -->
            <div class="text-input">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required aria-required="true">
            </div>

            <!-- Address -->
            <div class="text-input">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address" required aria-required="true">
            </div>

            <!-- Pincode -->
            <div class="text-input">
                <label for="pincode">Pincode</label>
                <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode" required pattern="\d{6}" aria-required="true">
            </div>

            <!-- Password -->
            <div class="text-input">
                <label for="pwd">Password <span class="hint">(min. 5 characters)</span></label>
                <input type="password" id="pwd" name="pwd" placeholder="Create a password" required minlength="5" aria-required="true">
            </div>

            <!-- Confirm Password -->
            <div class="text-input">
                <label for="confpwd">Confirm Password</label>
                <input type="password" id="confpwd" name="confpwd" placeholder="Re-enter your password" required minlength="5" aria-required="true">
            </div>

            <button type="submit" class="signin-btn">Signup</button>

            <div class="create">
                <a href="{{ url_for('auth.user_login') }}">Already have an account? Login Here</a>
            </div>
        </form>
    </div>

    <script>
        function validateForm() {
            const pwd = document.getElementById('pwd').value;
            const confpwd = document.getElementById('confpwd').value;

            if (pwd !== confpwd) {
                alert("Passwords do not match.");
                return false;  // Prevent form submission
            }
            return true;  // Allow form submission
        }
    </script>
</body>
</html>
