<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Professional Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/signup.css') }}">
    <style>
        #loading-spinner {
            display: none;
        }
        .text-input select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 4px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            box-shadow: 0 2px 12px rgba(128, 0, 128, 0.5);
            transition: box-shadow 0.3s ease-in-out;
        }
        .text-input select option {
            background: #1a1a3a;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-popup flash-message {{ messages[-1][0] }}" aria-live="polite">{{ messages[-1][1] }}</div>
        <script>
            setTimeout(function () {
                var flashMessage = document.querySelector('.flash-popup');
                if (flashMessage) {
                    flashMessage.remove();
                }
            }, 5000);
        </script>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.service_professional_signup') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="signup">
                <h3 class="title">Create Account</h3>
                
                <div class="text-input">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" required aria-required="true">
                </div>
                
                <div class="text-input">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required aria-required="true">
                </div>
                
                <div class="text-input">
                    <label for="pwd">Password (min 5 characters)</label>
                    <input type="password" id="pwd" name="pwd" placeholder="Password" required minlength="5" aria-required="true">
                </div>
                
                <div class="text-input">
                    <label for="confpwd">Confirm Password</label>
                    <input type="password" id="confpwd" name="confpwd" placeholder="Confirm Password" required aria-required="true">
                </div>

                <div class="text-input">
                    <label for="phone">Contact</label>
                    <input type="tel" id="phone" name="phone" placeholder="Phone Number" required aria-required="true">
                </div>
                
                <div class="text-input">
                    <label for="service_type">Service Type</label>
                    <select id="service_type" name="service_type" required aria-required="true">
                        <option value="" disabled selected>Select a Service</option>
                        {% for s in services %}
                            <option value="{{ s.name }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="text-input">
                    <label for="experience">Experience (years)</label>
                    <input type="number" id="experience" name="experience" placeholder="Experience" required min="0" aria-required="true">
                </div>

                <div class="text-input">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Address" required aria-required="true">
                </div>
                
                <div class="text-input">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode" placeholder="Pincode" required pattern="\d{6}" aria-required="true">
                </div>
                
                <button type="submit" class="signin-btn">Signup</button>
                
                <div class="create">
                    <a href="{{ url_for('auth.service_professional_login') }}">Already Registered? Click here</a>
                </div>
            </div>
        </form>

        <div class="spinner" id="loading-spinner"></div>
     </div>

    <script>
        document.querySelector('form').addEventListener('submit', function () {
            document.getElementById('loading-spinner').style.display = 'block';
        });
    </script>
</body>
</html>
