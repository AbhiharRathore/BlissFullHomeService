<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Service - {{ service_request.service.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/signup.css') }}">
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-popup {{ 'success' if category == 'success' else 'danger' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('main.submit_rating', service_request_id=service_request.id) }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h3 class="title">Rate Service</h3>
            <p style="text-align: center; color: #e0e0e0; margin-bottom: 1.2rem; font-size: 1rem;">
                <strong>{{ service_request.service.name }}</strong>
            </p>

            <!-- Rating Select Dropdown -->
            <div class="text-input">
                <label for="rating">Rating (1 to 5 Stars)</label>
                <select name="rating" id="rating" required style="width: 100%; padding: 0.5rem; border-radius: 4px; border: none; background: rgba(30, 30, 60, 0.9); color: #ffffff; font-size: 0.9rem; outline: none; box-shadow: 0 2px 12px rgba(128, 0, 128, 0.5);">
                    <option value="" disabled selected>Select Rating</option>
                    <option value="5" style="background: #1a1a2e; color: #fff;">5 Stars - Excellent</option>
                    <option value="4" style="background: #1a1a2e; color: #fff;">4 Stars - Good</option>
                    <option value="3" style="background: #1a1a2e; color: #fff;">3 Stars - Average</option>
                    <option value="2" style="background: #1a1a2e; color: #fff;">2 Stars - Poor</option>
                    <option value="1" style="background: #1a1a2e; color: #fff;">1 Star - Terrible</option>
                </select>
            </div>

            <!-- Review Textarea -->
            <div class="text-input">
                <label for="review">Review</label>
                <textarea id="review" name="review" rows="4" placeholder="Leave your review here..." style="width: 100%; padding: 0.5rem; border-radius: 4px; border: none; background: rgba(255, 255, 255, 0.1); color: #ffffff; font-size: 0.9rem; outline: none; box-shadow: 0 2px 12px rgba(128, 0, 128, 0.5); resize: vertical;"></textarea>
            </div>

            <button type="submit" class="signin-btn">Submit Rating</button>

            <div class="create">
                <a href="{{ url_for('main.user_dashboard') }}">Back to Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
